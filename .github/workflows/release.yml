name: Release

# Release is gated on proof, not assertion:
#   quality -> unit matrix -> L3 container matrix -> L4 REAL reboot harness
# Only after all pass does a tag produce a downloadable release.
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      gate_only:
        description: "Run gates only (no release) to verify release-readiness"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  quality:
    name: lint / types / format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy --strict -p patchcycle
      - run: python tools/ci_guard.py
      - run: python tools/check_doc_links.py
      - run: |
          pip install pip-audit
          pip list --format=freeze --exclude d3v-patchcycle > audit-requirements.txt
          pip-audit --strict --no-deps --disable-pip -r audit-requirements.txt

  unit:
    name: unit tests (py${{ matrix.python }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: sudo "$(command -v python)" -m pytest --cov --cov-report=term --ignore=tests/integration

  containers:
    name: L3 provider container (${{ matrix.image }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "ubuntu:22.04"
            alias: ubuntu_22_04
          - image: "ubuntu:24.04"
            alias: ubuntu_24_04
          - image: "debian:12"
            alias: debian_12
          - image: "debian:13"
            alias: debian_13
          - image: "rockylinux:9"
            alias: rockylinux_9
          - image: "almalinux:9"
            alias: almalinux_9
          - image: "fedora:44"
            alias: fedora_44
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Container integration tests
        run: pytest -m container tests/integration -k "${{ matrix.alias }}"
        env:
          PYTEST_ADDOPTS: ""

  reboot-gate:
    name: L4 real reboot harness (release gate)
    needs: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        power_cut: ["0", "1"]
    env:
      POWER_CUT: ${{ matrix.power_cut }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install harness dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
          curl openssh-client python3 python3-venv
      - name: Run reboot/resume harness
        run: bash tests/vm/reboot_harness.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l4-release-gate-logs-power-cut-${{ matrix.power_cut }}
          path: |
            /tmp/patchcycle-l4.*/*.log
            /tmp/patchcycle-l4.*/report.json
            /tmp/patchcycle-l4.*/boot-*.txt
            /tmp/patchcycle-l4.*/artifact-sha256.txt
            /tmp/patchcycle-l4.*/pre-cut-state.json
          if-no-files-found: ignore

  release:
    name: build + publish release
    # Only publish on a real tag push, after every gate passed.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: reboot-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version consistency (tag == package version)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Validate and package installable bundle
        run: |
          pip install twine
          twine check dist/*.whl dist/*.tar.gz
          python tools/package_bundle.py
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'b') || contains(github.ref_name, 'a') }}
