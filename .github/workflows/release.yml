name: Release

# Release is gated on proof, not assertion:
#   quality -> unit matrix -> L3 container matrix -> L4 REAL reboot harness
# Only after all pass does a tag produce a downloadable release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      gate_only:
        description: "Run gates only (no release) to verify release-readiness"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  quality:
    name: lint / types / format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .[dev]
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy --strict -p patchcycle

  unit:
    name: unit tests (py${{ matrix.python }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: pytest --cov --cov-report=term -m "not container"

  containers:
    name: L3 provider container (${{ matrix.image }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        image:
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "debian:12"
          - "debian:13"
          - "rockylinux:9"
          - "almalinux:9"
          - "fedora:41"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .[dev]
      - name: Container integration tests
        run: pytest -m container tests/integration -k "${{ matrix.image }}"
        env:
          PYTEST_ADDOPTS: ""

  reboot-gate:
    name: L4 real reboot harness (release gate)
    needs: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install harness dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
          curl openssh-client python3
      - name: Run reboot/resume harness
        run: bash tests/vm/reboot_harness.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l4-release-gate-logs
          path: /tmp/patchcycle-l4.*/
          if-no-files-found: ignore

  release:
    name: build + publish release
    # Only publish on a real tag push, after every gate passed.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: reboot-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version consistency (tag == package version)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Package portable zip (installable bundle)
        run: |
          pip install build
          python -m build --outdir dist
          python - <<'PY'
          import glob, shutil, pathlib
          whl = glob.glob("dist/*.whl")[0]
          out = pathlib.Path("dist") / (
              "d3v-patchcycle-" +
              __import__("tomllib").load(open("pyproject.toml","rb"))["project"]["version"]
              + "-portable")
          out.mkdir(parents=True, exist_ok=True)
          shutil.copy(whl, out)
          shutil.copy("README.md", out)
          for doc in ["docs/operations/operations.md", "docs/specifications/configuration.md"]:
              shutil.copy(doc, out)
          shutil.make_archive(str(out), "zip", out)
          PY
      - name: Generate checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'b') || contains(github.ref_name, 'a') }}
