name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint / types / format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: pip install -e .[dev]
      - name: ruff check
        run: ruff check src tests
      - name: ruff format check
        run: ruff format --check src tests
      - name: mypy strict
        run: mypy --strict -p patchcycle
      - name: pip-audit (dev environment)
        run: |
          pip install pip-audit
          pip-audit --strict || echo "pip-audit findings require triage" && exit 1

  unit:
    name: unit tests (py${{ matrix.python }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev dependencies
        run: pip install -e .[dev]
      - name: Guard: never run real maintenance commands on the runner
        run: |
          # Fails the build if any test module executes real package-manager
          # or reboot binaries outside fixture/container-marked tests.
          ! grep -rn --include='*.py' -E 'subprocess\.(run|Popen)\(\s*\[?"(apt-get|dnf|zypper|pacman|systemctl", "reboot)' tests/ src/
      - name: pytest with coverage
        run: pytest --cov --cov-report=term -m "not container"
        shell: bash

  container-integration:
    name: L3 container matrix (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "debian:12"
          - "debian:13"
          - "rockylinux:9"
          - "almalinux:9"
          - "fedora:41"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: pip install -e .[dev]
      - name: Container integration tests
        run: pytest -m container tests/integration -k "${{ matrix.image }}"
        env:
          PYTEST_ADDOPTS: ""

  build:
    name: package build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and validate
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  # Phase 3+: container provider integration matrix (ubuntu:22.04/24.04,
  # debian:12/13) is added here. Phase 7 adds the VM reboot harness as a
  # scheduled (nightly) workflow, never per-PR destructive runs.
