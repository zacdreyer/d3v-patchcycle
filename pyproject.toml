[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d3v-patchcycle"
version = "0.2.0.dev0"
description = "Stateful, reboot-safe server maintenance utility"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "D3V" }]
# NFR-01: zero runtime dependencies. Do not add entries to this list
# without an ADR superseding ADR-0001.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
d3v-patchcycle = "patchcycle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "linux: requires Linux system facilities (flock paths, systemd)",
    "container: runs inside a disposable container with a real package manager",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C90"]
# S101 (assert) is fine in tests; configured per-directory below.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
mypy_path = "src"
packages = ["patchcycle"]
strict = true
python_version = "3.11"

[tool.coverage.run]
source = ["src/patchcycle"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    # Platform-specific branches: exercised on their native CI runners
    # (Linux containers/VMs for POSIX, Windows dev host for win32).
    "if sys\\.platform == \"win32\":",
    "if os\\.name != \"posix\":",
    "if os\\.name == \"posix\":",
    "hasattr\\(os, \"O_NOFOLLOW\"\\)",
]
